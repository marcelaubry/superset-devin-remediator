[project]
name = "superset-devin-remediator"
version = "0.1.0"
description = "Simulation-first Superset issue remediation orchestration."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "jsonschema>=4.23.0",
  "prometheus-client>=0.20.0",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.35",
  "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = ["mypy>=1.11.2", "pytest>=8.3.3", "pytest-asyncio>=0.24.0", "ruff>=0.6.8", "types-psycopg2>=2.9.21.20240819"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["remediator"]
ignore_missing_imports = true
