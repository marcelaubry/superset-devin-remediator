<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Remediator{% endblock %} · Superset Devin Remediator</title>
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
<a class="skip-link" href="#main">Skip to main content</a>
{% block topbar %}{% include "partials/topbar.html" %}{% endblock %}
<main id="main" tabindex="-1">
{% block banner %}
<div id="stale-banner" class="banner" role="status" aria-live="polite" hidden>Live refresh is stale — data may be out of date. <span id="stale-detail"></span></div>
{% endblock %}
{% block content %}{% endblock %}
</main>
{% block scripts %}
<script src="/static/htmx.min.js"></script>
<script>
(function () {
  var banner = document.getElementById("stale-banner");
  var detail = document.getElementById("stale-detail");
  if (!banner) { return; }
  var lastOk = Date.now();
  var lastError = null;
  var STALE_MS = 10000;
  function show(text, isError) {
    detail.textContent = text || "";
    banner.classList.toggle("banner-err", !!isError);
    banner.classList.add("is-visible");
    banner.hidden = false;
  }
  // Pages that only poll a body region keep the topbar refresh stamp in step with the server's Date header.
  function stamp(dateHeader) {
    var el = document.getElementById("rendered-at");
    var when = dateHeader ? new Date(dateHeader) : null;
    if (!el || !when || isNaN(when.getTime())) { return; }
    var iso = when.toISOString().replace(/\.\d{3}Z$/, "Z");
    el.setAttribute("datetime", iso);
    el.setAttribute("title", iso);
    el.textContent = iso.slice(11);
  }
  function hide() {
    banner.classList.remove("is-visible", "banner-err");
    banner.hidden = true;
  }
  document.body.addEventListener("htmx:afterRequest", function (evt) {
    var xhr = evt.detail && evt.detail.xhr;
    if (!xhr) { return; }
    if (xhr.status === 401) {
      window.location.assign(xhr.getResponseHeader("HX-Redirect") || "/login");
      return;
    }
    if (evt.detail.successful) {
      lastOk = Date.now();
      lastError = null;
      hide();
      stamp(xhr.getResponseHeader("Date"));
    } else {
      lastError = "Last response: HTTP " + xhr.status + ".";
    }
  });
  document.body.addEventListener("htmx:sendError", function () {
    lastError = "The server could not be reached.";
  });
  // Polling swaps replace the DOM: carry focus (hx-preserve drops it) and <details> disclosure state across.
  var focused = null;
  var openDetails = null;
  document.body.addEventListener("htmx:beforeSwap", function (evt) {
    var el = document.activeElement;
    if (el && el.id && el.closest("[hx-preserve]")) {
      focused = { id: el.id, start: el.selectionStart, end: el.selectionEnd };
    }
    var target = evt.detail && evt.detail.target;
    if (target) {
      openDetails = { target: target, keys: [] };
      detailsKeys(target).forEach(function (pair) { if (pair[0].open) { openDetails.keys.push(pair[1]); } });
    }
  });
  // Identify each <details> by id or summary text, disambiguating repeats (e.g. BASE/HEAD stdout) by order.
  function detailsKeys(root) {
    var seen = {};
    return Array.prototype.map.call(root.querySelectorAll("details"), function (d) {
      var summary = d.querySelector(":scope > summary");
      var base = (d.id || "") + "|" + (summary ? summary.textContent.trim() : "");
      seen[base] = (seen[base] || 0) + 1;
      return [d, base + "#" + seen[base]];
    });
  }
  document.body.addEventListener("htmx:afterSettle", function () {
    if (openDetails && openDetails.keys.length) {
      var keys = openDetails.keys;
      detailsKeys(openDetails.target).forEach(function (pair) {
        if (keys.indexOf(pair[1]) !== -1) { pair[0].open = true; }
      });
    }
    openDetails = null;
    if (!focused) { return; }
    var saved = focused;
    focused = null;
    var el = document.getElementById(saved.id);
    if (el && document.activeElement !== el) {
      el.focus({ preventScroll: true });
      if (typeof el.setSelectionRange === "function" && saved.start != null) {
        try { el.setSelectionRange(saved.start, saved.end); } catch (e) {}
      }
    }
  });
  window.setInterval(function () {
    var age = Date.now() - lastOk;
    if (age > STALE_MS) {
      show("Last successful refresh " + Math.round(age / 1000) + "s ago. " + (lastError || ""), !!lastError);
    }
  }, 1000);
})();
</script>
{% endblock %}
</body>
</html>
