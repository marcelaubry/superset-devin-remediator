<section id="case-status"><h2>Status</h2>{% if error %}<p role="alert">{{error}}</p>{% endif %}<p><strong>State:</strong> {{case.state}}</p>{% if case.state in ["FAILED","TIMED_OUT","HUMAN_BLOCKED"] %}<form method="post" action="/operator/cases/{{case.id}}/retry" hx-post="/operator/cases/{{case.id}}/retry" hx-target="#case-status" hx-swap="outerHTML"><button>Retry</button></form>{% endif %}{% if case.state not in ["CI_PASSED","TIMED_OUT","POLICY_REJECTED","FAILED","CANCELLED"] %}<form method="post" action="/operator/cases/{{case.id}}/cancel" hx-post="/operator/cases/{{case.id}}/cancel" hx-target="#case-status" hx-swap="outerHTML"><button>Cancel</button></form>{% endif %}</section>
