services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remediator
      POSTGRES_PASSWORD: remediator
      POSTGRES_DB: remediator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remediator -d remediator"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://remediator:remediator@db:5432/remediator
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://remediator:remediator@db:5432/remediator
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://remediator:remediator@db:5432/remediator
    command: python -m remediator.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
